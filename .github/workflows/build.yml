# MotionTest.ipa on a macOS runner (Xcode's clang and SDK), kept as the run's artifact: on every push, and by hand.
# A tag v<version> (v1.2) also publishes it on the Releases page as MotionTest-<version>.ipa.
name: build
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MotionTest-ipa
          path: build/MotionTest.ipa
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          cp build/MotionTest.ipa "build/MotionTest-$v.ipa"
          gh release create "$GITHUB_REF_NAME" "build/MotionTest-$v.ipa" --title "Motion Test $v" --notes "Not signed by Apple: for an iOS that installs apps without Apple's signature, such as the Redmi K40 port (https://github.com/xiongnemo/hakios-alioth)."
